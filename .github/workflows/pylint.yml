name: Lint Code

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # Started by device-report.yml for its pull requests (GITHUB_TOKEN pushes
  # don't trigger workflows).
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only the tested devices list changed?
        id: scope
        uses: ./.github/actions/list-only
      
      - name: Set up Python
        if: steps.scope.outputs.only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        if: steps.scope.outputs.only != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant bacpypes3 voluptuous ruff
          
      - name: Run Ruff (Linting)
        if: steps.scope.outputs.only != 'true'
        run: ruff check .
        
      - name: Run Ruff (Formatting check)
        if: steps.scope.outputs.only != 'true'
        run: ruff format --check .
