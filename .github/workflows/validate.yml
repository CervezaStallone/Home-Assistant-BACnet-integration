name: Validate Integration
on:
  push:
    branches:
      - main
      - master
  pull_request:
  # Started by device-report.yml for its pull requests (GITHUB_TOKEN pushes
  # don't trigger workflows).
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  hassfest:
    name: Run Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only the tested devices list changed?
        id: scope
        uses: ./.github/actions/list-only
        
      - name: Run Hassfest validation
        if: steps.scope.outputs.only != 'true'
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: Run HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only the tested devices list changed?
        id: scope
        uses: ./.github/actions/list-only
        
      - name: Run HACS validation
        if: steps.scope.outputs.only != 'true'
        uses: hacs/action@main
        with:
          category: integration
