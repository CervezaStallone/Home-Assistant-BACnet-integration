name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Read pinned bacpypes3 version from manifest.json
        id: manifest
        run: |
          BACPYPES_REQ=$(python -c "
          import json
          data = json.load(open('custom_components/bacnet/manifest.json'))
          reqs = [r for r in data.get('requirements', []) if r.lower().startswith('bacpypes3')]
          print(reqs[0] if reqs else 'bacpypes3')
          ")
          echo "requirement=$BACPYPES_REQ" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the exact bacpypes3 pin declared in manifest.json so tests
          # exercise the same version that actually ships to users.
          pip install "${{ steps.manifest.outputs.requirement }}"
          pip install pytest pytest-cov voluptuous

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=custom_components/bacnet \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
