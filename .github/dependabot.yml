version: 2
updates:
  # Only GitHub Actions versions (actions/checkout, setup-python, etc.) —
  # not a Python ecosystem entry, since bacpypes3's pin lives in
  # custom_components/bacnet/manifest.json, which Dependabot doesn't
  # understand as a dependency manifest.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # tests_ha/requirements-min.txt pins the MINIMUM supported Home Assistant
  # (2024.4) and its test harness on purpose, so CI keeps proving the
  # integration still works there. Bumping any pin defeats that (a security
  # update once moved it to HA 2026.7 + pytest 9 and broke the job). These
  # are CI-only test dependencies, never shipped to users. The ignore rule
  # also applies to Dependabot security updates.
  - package-ecosystem: "pip"
    directory: "/tests_ha"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
